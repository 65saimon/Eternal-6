<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="goldGradEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DEC0" />
      <stop offset="30%" stop-color="#D6B878" />
      <stop offset="70%" stop-color="#B89A58" />
      <stop offset="100%" stop-color="#8C6E33" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D211C" />
      <stop offset="100%" stop-color="#19110E" />
    </linearGradient>
    <linearGradient id="pearlGradEmblem" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFFDF9" />
      <stop offset="80%" stop-color="#EBE3D5" />
      <stop offset="100%" stop-color="#C5B8A5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D6B878" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular Outer Background -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)"/>

  <!-- Outer Fine Gold Rings & Pearl Accents -->
  <circle cx="100" cy="100" r="92" stroke="url(#goldGradEmblem)" stroke-width="1.2" opacity="0.8"/>
  <circle cx="100" cy="100" r="88" stroke="url(#goldGradEmblem)" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- 6-Petal Continuous Monogram -->
  <g transform="translate(100, 85)" filter="url(#glow)">
    <g stroke="url(#goldGradEmblem)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 0 -12 C -20 -32, -28 -48, 0 -48 C 28 -48, 20 -32, 0 -12 Z" />
      <path d="M 0 -12 C -20 -32, -28 -48, 0 -48 C 28 -48, 20 -32, 0 -12 Z" transform="rotate(60)" />
      <path d="M 0 -12 C -20 -32, -28 -48, 0 -48 C 28 -48, 20 -32, 0 -12 Z" transform="rotate(120)" />
      <path d="M 0 -12 C -20 -32, -28 -48, 0 -48 C 28 -48, 20 -32, 0 -12 Z" transform="rotate(180)" />
      <path d="M 0 -12 C -20 -32, -28 -48, 0 -48 C 28 -48, 20 -32, 0 -12 Z" transform="rotate(240)" />
      <path d="M 0 -12 C -20 -32, -28 -48, 0 -48 C 28 -48, 20 -32, 0 -12 Z" transform="rotate(300)" />
    </g>

    <!-- Central Pearl (Moti) -->
    <circle cx="0" cy="0" r="11" fill="url(#pearlGradEmblem)"/>
    <circle cx="0" cy="0" r="11" stroke="url(#goldGradEmblem)" stroke-width="1" opacity="0.6"/>
    <ellipse cx="-3.5" cy="-3.5" rx="3" ry="1.8" fill="#FFFFFF" opacity="0.9" transform="rotate(-30, -3.5, -3.5)"/>
  </g>

  <!-- Typography: ETERNAL 6 -->
  <text x="100" y="152" font-family="'Cinzel', 'Playfair Display', 'Bodoni MT', serif" font-size="16" font-weight="600" fill="url(#goldGradEmblem)" letter-spacing="3" text-anchor="middle">ETERNAL 6</text>
  <text x="100" y="168" font-family="'Montserrat', 'Inter', sans-serif" font-size="6.5" font-weight="500" fill="#E7D8C5" letter-spacing="3" text-anchor="middle">TIMELESS ELEGANCE</text>
</svg>
